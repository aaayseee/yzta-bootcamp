name: LoyalCart CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_ENGINE: sqlite
      SQLITE_PATH: loyalcart_ci.db
      LOYALCART_ADMIN_PASSWORD: StrongCiPassword1!
      LOYALCART_API_KEY: ci-api-key
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          arayuz.py main.py prediction_service.py
          db services components pages_views tests

      - id: repository
        name: Repository tests
        continue-on-error: true
        run: python -m unittest -v tests.test_repository

      - id: security
        name: Security tests
        continue-on-error: true
        run: python -m unittest -v tests.test_security

      - id: telegram
        name: Telegram tests
        continue-on-error: true
        run: python -m unittest -v tests.test_telegram

      - id: email
        name: Email tests
        continue-on-error: true
        run: python -m unittest -v tests.test_email_service

      - id: api
        name: API tests
        continue-on-error: true
        run: python -m unittest -v tests.test_api

      - id: streamlit
        name: Streamlit smoke test
        continue-on-error: true
        run: python -m unittest -v tests.test_streamlit_app

      - name: Publish diagnostic summary
        if: always()
        env:
          REPOSITORY_RESULT: ${{ steps.repository.outcome }}
          SECURITY_RESULT: ${{ steps.security.outcome }}
          TELEGRAM_RESULT: ${{ steps.telegram.outcome }}
          EMAIL_RESULT: ${{ steps.email.outcome }}
          API_RESULT: ${{ steps.api.outcome }}
          STREAMLIT_RESULT: ${{ steps.streamlit.outcome }}
        run: |
          {
            echo "## LoyalCart CI diagnostic"
            echo "| Test module | Result |"
            echo "|---|---|"
            echo "| repository | $REPOSITORY_RESULT |"
            echo "| security | $SECURITY_RESULT |"
            echo "| telegram | $TELEGRAM_RESULT |"
            echo "| email | $EMAIL_RESULT |"
            echo "| api | $API_RESULT |"
            echo "| streamlit | $STREAMLIT_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
