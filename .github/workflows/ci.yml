name: LoyalCart CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_ENGINE: sqlite
      SQLITE_PATH: loyalcart_ci.db
      LOYALCART_ADMIN_PASSWORD: StrongCiPassword1!
      LOYALCART_API_KEY: ci-api-key
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          arayuz.py main.py prediction_service.py
          db services components pages_views tests

      - name: Repository tests
        run: python -m unittest -v tests.test_repository

      - name: Security tests
        run: python -m unittest -v tests.test_security

      - name: Telegram tests
        run: python -m unittest -v tests.test_telegram

      - name: Email tests
        run: python -m unittest -v tests.test_email_service

      - name: API tests
        run: python -m unittest -v tests.test_api

      - name: Streamlit smoke test
        run: python -m unittest -v tests.test_streamlit_app
