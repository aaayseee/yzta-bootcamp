name: LoyalCart CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q arayuz.py main.py prediction_service.py db services components pages_views tests

      - name: Run tests
        env:
          DB_ENGINE: sqlite
          SQLITE_PATH: loyalcart_ci.db
          LOYALCART_ADMIN_PASSWORD: StrongCiPassword1!
          LOYALCART_API_KEY: ci-api-key
        run: python -m unittest discover -s tests -v
