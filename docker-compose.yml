services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: loyalcart
      MYSQL_USER: loyalcart
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-loyalcart-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-loyalcart-root-dev-password}
    volumes:
      - loyalcart_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment: &loyalcart_environment
      DB_ENGINE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: loyalcart
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-loyalcart-dev-password}
      MYSQL_DB: loyalcart
      LOYALCART_ADMIN_USERNAME: ${LOYALCART_ADMIN_USERNAME:-admin}
      LOYALCART_ADMIN_EMAIL: ${LOYALCART_ADMIN_EMAIL:-admin@example.com}
      LOYALCART_ADMIN_PASSWORD: ${LOYALCART_ADMIN_PASSWORD:?LOYALCART_ADMIN_PASSWORD must be set}
      LOYALCART_INVITE_CODE: ${LOYALCART_INVITE_CODE:?LOYALCART_INVITE_CODE must be set}
      LOYALCART_API_KEY: ${LOYALCART_API_KEY:?LOYALCART_API_KEY must be set}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOYALCART_APP_URL: ${LOYALCART_APP_URL:-http://localhost:8501}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  streamlit:
    build: .
    environment:
      <<: *loyalcart_environment
      LOYALCART_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  loyalcart_mysql:
